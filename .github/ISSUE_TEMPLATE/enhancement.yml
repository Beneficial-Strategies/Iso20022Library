name: Enhancement
description: A change to how the library works, or a cleanup of the code
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will exist when this is done. One deliverable per issue.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable conditions, including how it is tested.
    validations:
      required: true
  - type: textarea
    id: release-note
    attributes:
      label: Release note (optional)
      description: One sentence for consumers, if the title does not say it. It goes into the NuGet release notes.
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Issues and pull requests, as #number.
