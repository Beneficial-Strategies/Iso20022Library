name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release for the tag once the packages are on NuGet
      id-token: write   # required so GitHub can issue the OIDC token NuGet Trusted Publishing exchanges for a short-lived API key — see https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A single .NET 10 SDK builds both TFMs (net8.0;net10.0) fine — the SDK targets older
      # frameworks via downloaded reference packs, no need to install multiple SDK versions
      # side by side just to pack. See src/global.json and CLAUDE.md "Target Framework Policy".

      # Primitives first: Common's ProjectReference to it becomes a PackageReference pinned to the same Version.
      - name: Build and pack (BeneficialStrategies.Iso20022.Primitives)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.Primitives \
            -c Release \
            --output ./nupkg

      - name: Build and pack (BeneficialStrategies.Iso20022.Interfaces)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.Interfaces \
            -c Release \
            --output ./nupkg

      - name: Build and pack (BeneficialStrategies.Iso20022)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.Common \
            -c Release \
            --output ./nupkg

      # Packed in dependency order per CLAUDE.md "Multi-Package Repository Strategy": the
      # companion package's ProjectReference to Common is auto-translated into a PackageReference
      # in its own .nuspec at pack time, pinned to Common's exact Version (both packages share
      # <Version> via Directory.Build.props, so this is always in lockstep, never a range).
      - name: Build and pack (BeneficialStrategies.Iso20022.FluentValidation)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.FluentValidation \
            -c Release \
            --output ./nupkg

      # Needs only Primitives (not the message records).
      - name: Build and pack (BeneficialStrategies.Iso20022.Factory)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.Factory \
            -c Release \
            --output ./nupkg

      # Needs only Primitives (not the message records); Payloads references it, so it is packed first.
      - name: Build and pack (BeneficialStrategies.Iso20022.FluentValidation.Xml)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.FluentValidation.Xml \
            -c Release \
            --output ./nupkg

      # Needs only Primitives (not the message records), so it is packed with the other packages that depend on Primitives alone.
      - name: Build and pack (BeneficialStrategies.Iso20022.FluentValidation.Payloads)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.FluentValidation.Payloads \
            -c Release \
            --output ./nupkg

      # Trusted Publishing (OIDC), replacing the long-lived NUGET_API_KEY secret. The GitHub OIDC
      # token from this workflow run is exchanged for a NuGet API key valid for 1 hour, matched
      # against the policy registered on nuget.org for Beneficial-Strategies/Iso20022Library,
      # workflow publish.yml, package owner "BeneficialStrategies.com". "user" below must be the
      # individual account that CREATED the policy, not the org that owns the packages —
      # confirmed the hard way (run 33442674763, 2026-08-31): passing the org name here fails
      # OIDC token exchange with "Make sure you are using the username of the policy creator, not
      # the policy owner". jefforyamos is an admin member of BeneficialStrategies.com, which is
      # what actually grants the push; this field just identifies who's asking.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: jefforyamos

      - name: Push to NuGet
        run: |
          dotnet nuget push src/nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # The GitHub Release carries the same notes as the NuGet package: the entry for this version in the core package's
      # release-notes.txt (written by tools/releasing/prepare_release.py). Pre-release versions (-alpha) are marked as such.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == v {found=1; next} found && /^[^ ]/ {exit} found {print}' \
            src/BeneficialStrategies.Iso20022.Common/release-notes.txt | sed 's/^    //' > release-body.md
          [ -s release-body.md ] || echo "See the NuGet package release notes." > release-body.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-body.md "${flags[@]}"
