name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required so GitHub can issue the OIDC token NuGet Trusted Publishing exchanges for a short-lived API key — see https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A single .NET 10 SDK builds both TFMs (net8.0;net10.0) fine — the SDK targets older
      # frameworks via downloaded reference packs, no need to install multiple SDK versions
      # side by side just to pack. See src/global.json and CLAUDE.md "Target Framework Policy".

      - name: Build and pack (BeneficialStrategies.Iso20022)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.Common \
            -c Release \
            --output ./nupkg

      # Packed in dependency order per CLAUDE.md "Multi-Package Repository Strategy": the
      # companion package's ProjectReference to Common is auto-translated into a PackageReference
      # in its own .nuspec at pack time, pinned to Common's exact Version (both packages share
      # <Version> via Directory.Build.props, so this is always in lockstep, never a range).
      - name: Build and pack (BeneficialStrategies.Iso20022.FluentValidation)
        run: |
          cd src
          dotnet pack BeneficialStrategies.Iso20022.FluentValidation \
            -c Release \
            --output ./nupkg

      # Trusted Publishing (OIDC), replacing the long-lived NUGET_API_KEY secret. The GitHub OIDC
      # token from this workflow run is exchanged for a NuGet API key valid for 1 hour, matched
      # against the policy registered on nuget.org for Beneficial-Strategies/Iso20022Library,
      # workflow publish.yml, policy owner "BeneficialStrategies.com". "user" below is the
      # nuget.org account the temporary key is issued for — the org's public account name, not a
      # secret (it's the same value shown as the package Owner on nuget.org).
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: BeneficialStrategies.com

      - name: Push to NuGet
        run: |
          dotnet nuget push src/nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
