name: Prepare release

# Chooses the next version from the labels of the issues closed since the last release and writes the NuGet release
# notes from them. It never tags or publishes: it pushes a release/vX.Y.Z branch for a human to review and merge.
# See doc/Releasing.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto reads the labels; choose another to override
        type: choice
        options: [auto, revision, minor, major]
        default: auto
      graduate:
        description: Allow a major bump out of 0.x (the first production release)
        type: boolean
        default: false
      suffix:
        description: "Replace the pre-release suffix, for example -beta (empty keeps it)"
        type: string
        default: ""
      dry_run:
        description: Show the version and notes in the job summary and push nothing
        type: boolean
        default: true

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test the release script
        run: python3 -m unittest -q test_prepare_release
        working-directory: tools/release

      - name: Choose the version and write the notes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          GRADUATE: ${{ inputs.graduate }}
          SUFFIX: ${{ inputs.suffix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--bump "$BUMP")
          [ "$GRADUATE" = "true" ] && args+=(--graduate)
          [ -n "$SUFFIX" ] && args+=(--suffix "$SUFFIX")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 tools/release/prepare_release.py "${args[@]}" | tee release-plan.txt
          { echo '```text'; cat release-plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the release branch
        if: ${{ !inputs.dry_run && steps.prepare.outputs.version != '' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add src/Directory.Build.props src/*/release-notes.txt
          git commit -m "Release $VERSION: version and release notes"
          git push origin "release/v$VERSION"
          {
            echo "### Release branch pushed"
            echo "[Open the pull request](https://github.com/${{ github.repository }}/compare/main...release/v$VERSION?expand=1&title=Release%20$VERSION)"
            echo
            echo "Edit the notes in the pull request if you want them in your own words, merge it, then tag \`v$VERSION\` on main to publish (doc/Releasing.md)."
          } >> "$GITHUB_STEP_SUMMARY"
