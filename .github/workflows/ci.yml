name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A single .NET 10 SDK builds both TFMs (net8.0;net10.0) fine — the SDK targets older
      # frameworks via downloaded reference packs, no need to install multiple SDK versions
      # side by side just to build/test. See src/global.json and CLAUDE.md
      # "Target Framework Policy".

      # TreatWarningsAsErrors is set repo-wide in src/Directory.Build.props, so this single
      # build step is also the zero-warnings gate — any warning not already suppressed there
      # (currently only CS0618/CS0612, an ongoing/expected condition, not a bug) fails here.
      - name: Build (both TFMs, zero warnings enforced)
        run: dotnet build src/iso20022.sln -c Release

      - name: Test (both TFMs)
        run: dotnet test src/iso20022.sln -c Release --no-build
